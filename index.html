<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サーフチェック</title>
  <!-- ?v= は更新の取りこぼし防止。CSS / JS を変更したら日付を上げる。
       これが無いと、新しい index.html と古いキャッシュの CSS / JS が
       混ざって画面が壊れる（GitHub Pages のキャッシュは 10 分）。 -->
  <link rel="stylesheet" href="style.css?v=20260920" />
</head>
<body>
  <main class="app-shell" data-mode="ranking">
    <header class="app-header">
      <p class="app-kicker">Surf Check</p>
      <div class="app-title-row">
        <div>
          <h1>サーフチェック</h1>
          <p class="ranking-only">エリア・日付・時間帯から、入りやすいポイントをランキングします。</p>
          <p class="weekly-only">エリアを選ぶと、ポイントごとの7日分の予報を表示します。</p>
        </div>
        <button type="button" id="checkTop" class="refresh" aria-label="チェックを実行">↻</button>
      </div>
    </header>

    <nav class="mode-tabs" role="tablist" aria-label="表示モード">
      <button type="button" id="tab-ranking" class="mode-tab" role="tab" data-mode="ranking" aria-controls="results" aria-selected="true">ランキング</button>
      <button type="button" id="tab-weekly" class="mode-tab" role="tab" data-mode="weekly" aria-controls="weekly" aria-selected="false">週間予報</button>
    </nav>

    <form id="controls" class="controls" onsubmit="return false;">
      <label>エリア
        <select id="region">
          <option value="千葉北">千葉北</option>
          <option value="千葉南">千葉南</option>
          <option value="千葉">千葉（北+南）</option>
          <option value="湘南">湘南</option>
          <option value="茨城">茨城</option>
          <option value="全域">全域</option>
        </select>
      </label>
      <label class="ranking-only">日付
        <input type="date" id="date" />
      </label>
      <label class="ranking-only">時間帯
        <select id="slot">
          <option value="morning">朝（07-10時）</option>
          <option value="afternoon">昼（12-15時）</option>
          <option value="evening">夕（16-19時）</option>
        </select>
      </label>
      <button type="button" id="check">チェック</button>
    </form>

    <section id="results" class="results ranking-only" aria-live="polite" role="tabpanel" aria-labelledby="tab-ranking">
      <div class="empty-state">
        <b>条件を選んでチェック</b>
        <span>波サイズ、風、うねり、潮情報をカードで比較できます。</span>
      </div>
    </section>

    <section id="weekly" class="results weekly-only" aria-live="polite" role="tabpanel" aria-labelledby="tab-weekly">
      <div class="empty-state">
        <b>エリアを選んでチェック</b>
        <span>各ポイントの7日分のスコアを、朝・昼・夕で比較できます。</span>
      </div>
    </section>

    <footer>データ提供: Open-Meteo（数値予報モデル）</footer>
  </main>
  <script src="scoring.js?v=20260920"></script>
  <script src="forecast.js?v=20260920"></script>
  <script src="app.js?v=20260920"></script>
</body>
</html>
